site_name: AgentBox
site_description: A minimal open-source agent platform — durable execution, sandboxed agents, Logfire tracing.
site_url: https://shenxianpeng.dev/agentbox/
repo_url: https://github.com/shenxianpeng/agentbox
repo_name: shenxianpeng/agentbox

theme:
  name: sumi
  accent: indigo

plugins:
  - search
  - sumi

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Design Decisions: design-decisions.md
  - Development: development.md

extra:
  social:
    - icon: brand-github
      link: https://github.com/shenxianpeng/agentbox

copyright: Copyright &copy; 2024 shenxianpeng
